name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for tests (optional, defaults to http://localhost:3000)'
        required: false
        default: 'http://localhost:3000'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Get Playwright Version
      id: playwright-version
      run: echo "VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}-${{ matrix.browser }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.VERSION }}-
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}

    - name: Create .env file if needed
      run: |
        if [ ! -f .env ]; then
          echo "BASE_URL=${{ github.event.inputs.base_url || 'http://localhost:3000' }}" > .env
          echo "ENV=ci" >> .env
          echo "CI=true" >> .env
        fi

    - name: Run Playwright tests
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
        CI: true
      run: npm run test -- --project=${{ matrix.browser }}

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30

    - name: Upload JUnit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: junit-report-${{ matrix.browser }}
        path: reports/junit/
        retention-days: 30

    - name: Upload JSON Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: json-report-${{ matrix.browser }}
        path: reports/json/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.browser }}
        path: test-results/
        retention-days: 30

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots-${{ matrix.browser }}
        path: test-results/**/*.png
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Videos
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: videos-${{ matrix.browser }}
        path: test-results/**/*.webm
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Traces
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: traces-${{ matrix.browser }}
        path: test-results/**/*.zip
        retention-days: 30
        if-no-files-found: ignore
